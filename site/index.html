  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  }

  html { font-size: 15px; scroll-behavior: smooth; }

  body {
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;

  }

  /* ================================================================
     App Shell
     ================================================================ */
  .app { display: flex; min-height: 100vh; }

  /* ================================================================
     Sidebar
     ================================================================ */
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    color: #b0b7c8;
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform var(--ease);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2a3040 transparent;
  }
  .sidebar::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 4px; }

  .sidebar-header {
    padding: 28px 22px 18px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  .sidebar-header h1 {
    font-size: 1rem;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -.02em;
    line-height: 1.35;
  }
  .sidebar-header .org {
    font-size: .68rem;
    color: #5c6478;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    font-weight: 600;
  }

  .sidebar-nav { flex: 1; padding: 14px 0 20px; }

    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: #4a5068;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .nav-group-label .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ic { background: var(--ic-color); }
  .dot-mgmt { background: var(--mgmt-color); }

  .nav-item {
    display: flex;
    align-items: center;
    padding: 8px 22px 8px 34px;
    font-size: .85rem;
    color: #8891a5;
    cursor: pointer;
    transition: all var(--ease);
    border-left: 3px solid transparent;
    user-select: none;
    text-decoration: none;
  }
  .nav-item:hover {
    background: var(--sidebar-hover);
    color: #c8cdd8;
  }
  .nav-item.active {
    background: var(--sidebar-active);
    color: #ffffff;
    font-weight: 600;
  }
  .nav-item.active.track-ic   { border-left-color: var(--ic-color); }
  .nav-item.active.track-mgmt { border-left-color: var(--mgmt-color); }

  .level-badge {
    margin-left: auto;
    font-size: .6rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,.05);
    color: #555e72;
    letter-spacing: .03em;
    flex-shrink: 0;
  }
  .nav-item.active .level-badge {
    background: rgba(255,255,255,.1);
    color: #8891a5;
  }

  /* ================================================================
     Mobile Controls
     ================================================================ */
  .mobile-toggle {
    display: none;
    position: fixed;
    top: 12px; left: 12px;
    z-index: 200;
    background: var(--sidebar-bg);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    width: 40px; height: 40px;
    font-size: 1.15rem;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    transition: background var(--ease);
  }
  .mobile-toggle:hover { background: #1e2231; }

  .mobile-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 99;
    backdrop-filter: blur(2px);
  }

     Main Content
     ================================================================ */

    min-width: 0;

    margin-bottom: 32px;

    font-size: .88rem;
    font-weight: 700;

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(8px); }

    font-size: 1.65rem;
    font-weight: 800;

    letter-spacing: -.03em;
    line-height: 1.2;
  }

    margin-top: 12px;
    font-size: .93rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .section-card {
    background: var(--card);

    border-radius: var(--radius);
    padding: 22px 26px;
    margin-bottom: 14px;
    transition: box-shadow var(--ease);

    box-shadow: 0 2px 14px rgba(0,0,0,.04);
  }
  .section-card h3 {
    font-size: .88rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 9px;

    width: 28px; height: 28px;

    justify-content: center;
    border-radius: 6px;

    color: var(--text-secondary);
    font-size: .86rem;
  }
  .section-card li {
    margin-bottom: 7px;
    line-height: 1.55;
  }

  .section-card p {
    color: var(--text-secondary);
    font-size: .86rem;
    line-height: 1.6;

    display: flex;
    border-radius: 6px;
    overflow: hidden;
    height: 26px;
    margin-bottom: 14px;
    gap: 2px;

    font-size: .62rem;
    font-weight: 700;
    color: #fff;

     ================================================================ */

    .main {

      padding: 68px 18px 60px;

    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle { display: flex; }
    .mobile-overlay.show { display: block; }
    .role-header h2 { font-size: 1.35rem; }

</style>

// =====================================================================
//  RENDER
// =====================================================================

function buildSidebar() {
  var nav = document.getElementById("sidebarNav");
  var ic   = ROLES.filter(function(r){ return r.track === "ic"; });
  var mgmt = ROLES.filter(function(r){ return r.track === "mgmt"; });
  var html = "";

  html += '<div class="nav-group">';
  html += '<div class="nav-group-label"><span class="dot dot-ic"></span> Individual Contributor</div>';
  ic.forEach(function(r){
    html += '<a class="nav-item track-ic" data-id="'+r.id+'">';
    html += r.title + '<span class="level-badge">'+r.level+'</span></a>';
  });
  html += '</div>';

  html += '<div class="nav-group">';
  html += '<div class="nav-group-label"><span class="dot dot-mgmt"></span> Management</div>';
  mgmt.forEach(function(r){
    html += '<a class="nav-item track-mgmt" data-id="'+r.id+'">';
    html += r.title + '<span class="level-badge">'+r.level+'</span></a>';
  });
  html += '</div>';

  nav.innerHTML = html;

  // Attach click handlers
  nav.querySelectorAll(".nav-item").forEach(function(el){
    el.addEventListener("click", function(){ selectRole(el.dataset.id); });
  });
}

function renderRole(role) {
  var tc = role.track;
  var trackName = tc === "ic" ? "Individual Contributor" : "Management";
  var iconClass = "section-icon " + tc;
  var h = "";

  // Banner
  h += '<div class="banner">';
  h += '<div class="banner-title">';
  h += '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1l2.12 4.3 4.74.69-3.43 3.34.81 4.72L8 11.77l-4.24 2.23.81-4.72L1.14 5.94l4.74-.69L8 1z" fill="currentColor"/></svg>';
  h += ' All Engineers</div>';
  h += '<ul>';
  h += '<li>Look for ways to help and support each other.</li>';
  h += '<li>Honor team commitments and respond to email/chat in a timely manner.</li>';
  h += '<li>Proactively ask for feedback from teammates, graciously accept it and identify ways to act upon it.</li>';
  h += '</ul></div>';

  // Role header
  h += '<div class="role-content">';
  h += '<div class="role-header">';
  h += '<span class="track-pill '+tc+'">'+trackName+' &middot; '+role.level+'</span>';
  h += '<h2>'+role.title+'</h2>';
  h += '<p class="role-scope">'+role.scope+'</p>';
  h += '</div>';

  // Empty state
  if (role.sections.length === 0 && role.experience.length === 0) {
    h += '<div class="section-card"><p class="placeholder-msg">Detailed expectations for this role are being developed. The scope description above defines the primary responsibility level.</p></div>';
  }

  // Section cards
  role.sections.forEach(function(sec){
    h += '<div class="section-card">';
    h += '<h3><span class="'+iconClass+'">'+sec.icon+'</span> '+sec.heading+'</h3>';
    h += '<ul>';
    sec.items.forEach(function(item){ h += '<li>'+item+'</li>'; });
    h += '</ul></div>';
  });

  // Activity breakdown
  if (role.activity.length > 0) {
    h += '<div class="section-card">';
    h += '<h3><span class="'+iconClass+'">\uD83D\uDCCA</span> Example Activity Breakdown</h3>';
    h += '<div class="activity-bar">';
    role.activity.forEach(function(a){
      h += '<div class="activity-seg" style="flex:'+a.pct+';background:'+a.color+'">'+a.pct+'%</div>';
    });
    h += '</div><div class="activity-legend">';
    role.activity.forEach(function(a){
      h += '<span class="legend-item"><span class="legend-swatch" style="background:'+a.color+'"></span>'+a.label+'</span>';
    });
    h += '</div></div>';
  }

  // Experience
  if (role.experience.length > 0) {
    h += '<div class="section-card">';
    h += '<h3><span class="'+iconClass+'">\uD83C\uDFC6</span> Experience</h3>';
    h += '<ul>';
    role.experience.forEach(function(e){ h += '<li>'+e+'</li>'; });
    h += '</ul></div>';
  }

  h += '</div>'; // .role-content
  return h;
}

// ── Selection ────────────────────────────────────────────

var currentId = null;

function selectRole(id) {
  var role = ROLES.find(function(r){ return r.id === id; });
  if (!role) return;
  currentId = id;

  // Update active nav
  document.querySelectorAll(".nav-item").forEach(function(el){
    el.classList.toggle("active", el.dataset.id === id);
  });

  // Render
  document.getElementById("mainContent").innerHTML = renderRole(role);

  // Close mobile sidebar
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("mobileOverlay").classList.remove("show");

  // Hash
  history.replaceState(null, "", "#" + id);

  // Scroll to top on mobile
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ── Mobile controls ──────────────────────────────────────

document.getElementById("mobileToggle").addEventListener("click", function(){
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("mobileOverlay").classList.toggle("show");
});
document.getElementById("mobileOverlay").addEventListener("click", function(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("mobileOverlay").classList.remove("show");
});

// ── Keyboard nav ─────────────────────────────────────────

document.addEventListener("keydown", function(e){
  if (e.key === "Escape") {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("mobileOverlay").classList.remove("show");
  }
  if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    var idx = ROLES.findIndex(function(r){ return r.id === currentId; });
    if (e.key === "ArrowDown" || e.key === "j") {
      if (idx < ROLES.length - 1) { e.preventDefault(); selectRole(ROLES[idx+1].id); }
    }
    if (e.key === "ArrowUp" || e.key === "k") {
      if (idx > 0) { e.preventDefault(); selectRole(ROLES[idx-1].id); }
    }
  }
});

// ── Init ─────────────────────────────────────────────────

buildSidebar();
var hash = location.hash.replace("#","");
var startId = ROLES.find(function(r){ return r.id === hash; }) ? hash : "engineer1";
selectRole(startId);

</script>
